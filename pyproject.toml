[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "miloctl"
version = "2.0.0"
description = "Milo — a portable, self-improving personal agent. One repo, one CLI, one brain."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Allan", email = "allan@dra.local" }]
keywords = ["agent", "assistant", "opencode", "claude-code", "mcp", "memory", "skills"]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
bot = ["python-telegram-bot>=20.0"]
pretty = ["rich>=13.0"]
voice = ["sounddevice>=0.4", "numpy>=1.20", "edge-tts>=7.0"]
voice-local = ["sounddevice>=0.4", "numpy>=1.20", "faster-whisper>=1.0"]
voice-wake = ["openwakeword>=0.5", "sounddevice>=0.4"]
embeddings = ["onnxruntime>=1.0", "numpy>=1.20"]
ml = ["onnxruntime>=1.0", "numpy>=1.20", "scipy>=1.0"]
dev = ["pytest>=7.0", "ruff>=0.4"]
all = ["python-telegram-bot>=20.0", "rich>=13.0"]

[project.urls]
Homepage = "https://github.com/dra-allan/milo-portable-system"
Source = "https://github.com/dra-allan/milo-portable-system"

[project.scripts]
milo = "miloctl.cli:main"
mylo = "miloctl.cli:main"
milo-mcp = "miloctl.mcp:main"
milo-daemon = "miloctl.daemon:main"
milo-dashboard = "miloctl.dashboard:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["miloctl*"]

[tool.setuptools.package-data]
miloctl = ["assets/**/*", "skills/**/*", "templates/**/*"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
