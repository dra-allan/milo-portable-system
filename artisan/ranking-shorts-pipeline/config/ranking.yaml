# Ranking Shorts pipeline configuration.
# Runtime files are outside the repo; set VIDEO_FACTORY_ROOT in config/.env
# to the same shared parent used by the other video pipelines.

defaults:
  clips_per_video: 5
  min_clip_seconds: 2.5
  max_clip_seconds: 9.0
  target_total_seconds: 45
  hard_max_total_seconds: 59
  candidates_per_topic: 30
  max_download_attempts: 6
  max_download_height: 480
  max_download_bytes: 100000000
  max_source_duration: 900
  min_source_views: 500
  max_words_per_second: 0.45
  max_music_confidence: 0.55
  max_text_coverage: 0.18
  blur_detected_text: true
  # scene_profile is scene-change density, not optical-flow motion. 0.10 was
  # rejecting ordinary single-shot moments and is why the run burned hours.
  min_motion_score: 0.02
  phash_distance: 6
  rank_colors:
    1: "0xFFD700"
    2: "0xC0C0C0"
    3: "0xCD7F32"
    4: "0x1E90FF"
    5: "0x1E90FF"
  rank_fill: "white"
  rank_outline: "black"
  accent_color: "0x1E90FF"
  rank_fontsize: 300
  clip_title_fontsize: 68
  video_title_fontsize: 62
  rank_y: 760
  clip_title_y: 1180
  video_title_y: 300
  transition: zoomin
  transition_duration: 0.28
  hook_zoom: true
  hook_zoom_amount: 1.18
  hook_zoom_frames: 24
  vo_offset: 0.4
  vo_gain: 1.6
  duck_threshold: 0.05
  duck_ratio: 8
  sfx_gain: 0.9
  swoosh_gain: 0.5
  music_enabled: false
  music_volume: 0.12

sfx_map:
  swoosh: swoosh.mp3
  slip: cartoon_slip.mp3
  fall: cartoon_slip.mp3
  splash: splash.mp3
  water: splash.mp3
  hit: punch.mp3
  crash: crash.mp3
  scream: scream.mp3
  boing: boing.mp3
  record: record_scratch.mp3
  fail: sad_trombone.mp3

topics:
  fishing_moments:
    title: "TOP {n} FISHING MOMENTS"
    queries: ["single fishing fail caught on camera", "unexpected fishing catch", "funny fishing moment caught"]
    channels: []
    extra_sources: []
    max_download_attempts: 6
    negative_keywords: ["compilation", "reaction", "top 10", "top 5", "ranked", "tutorial", "asmr", "music", "podcast", "commentary"]
    channel: NXS
    tags: ["fishing", "fishingfails", "funnymoments", "top5", "shorts"]

