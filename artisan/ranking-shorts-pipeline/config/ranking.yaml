# Ranking Shorts pipeline configuration.
# Runtime files are outside this repo; set VIDEO_FACTORY_ROOT in config/.env
# to the same shared parent used by the other video pipelines.

# NOTE ON `defaults:` -- it is GLOBAL, not per-topic.
# RankingConfig.topic() (src/config.py) returns the raw topic dict with five
# setdefault calls and never merges `defaults`, and config.get() reads
# `defaults` only. So there is no such thing as a topic-level override:
# changing max_music_confidence for gta6_countdown also changes it for
# fishing_moments and animal_moments. Design around the values below rather
# than loosening them for one topic.
defaults:
  clips_per_video: 5
  min_clip_seconds: 2.5
  max_clip_seconds: 9.0
  target_total_seconds: 45
  hard_max_total_seconds: 59
  candidates_per_topic: 40
  max_source_duration: 900
  min_source_views: 500
  max_words_per_second: 0.45
  max_music_confidence: 0.55
  max_text_coverage: 0.18
  blur_detected_text: true
  min_motion_score: 0.10
  phash_distance: 6
  rank_colors:
    1: "0xFFD700"
    2: "0xC0C0C0"
    3: "0xCD7F32"
    4: "0x1E90FF"
    5: "0x1E90FF"
  rank_fill: "white"
  rank_outline: "black"
  accent_color: "0x1E90FF"
  rank_fontsize: 300
  clip_title_fontsize: 68
  video_title_fontsize: 62
  rank_y: 760
  clip_title_y: 1180
  video_title_y: 300
  transition: zoomin
  transition_duration: 0.28
  hook_zoom: true
  hook_zoom_amount: 1.18
  hook_zoom_frames: 24
  vo_offset: 0.4
  vo_gain: 1.6
  duck_threshold: 0.05
  duck_ratio: 8
  sfx_gain: 0.9
  swoosh_gain: 0.5
  music_enabled: false
  music_volume: 0.12

sfx_map:
  swoosh: swoosh.mp3
  slip: cartoon_slip.mp3
  fall: cartoon_slip.mp3
  splash: splash.mp3
  water: splash.mp3
  hit: punch.mp3
  crash: crash.mp3
  scream: scream.mp3
  boing: boing.mp3
  record: record_scratch.mp3
  fail: sad_trombone.mp3

topics:
  fishing_moments:
    title: "TOP {n} FISHING MOMENTS"
    # Same discovery shape as the Shorts pipeline: yt-dlp searches YouTube
    # and walks configured YouTube channel video feeds. No TikTok/Instagram
    # source is enabled in the shipped config.
    queries:
      - "funny fishing moments"
      - "fishing fails"
      - "big fish catch"
    channels: []
    extra_sources: []
    negative_keywords: ["compilation", "reaction", "top 10", "top 5", "ranked", "tutorial", "asmr", "music", "podcast", "commentary"]
    channel: ranking_fishing
    tags: ["fishing", "fishingfails", "funnymoments", "top5", "shorts"]

  animal_moments:
    title: "TOP {n} ANIMAL MOMENTS"
    queries:
      - "funny animal moments"
      - "animal fails"
      - "animal caught on camera"
    channels: []
    extra_sources: []
    negative_keywords: ["compilation", "reaction", "top 10", "ranked", "music", "podcast", "commentary"]
    channel: ranking_animals
    tags: ["animals", "funnyanimals", "top5", "shorts"]

  # -------------------------------------------------------------------------
  # gta6_countdown -- Lane A of the GTA plan (see
  # artisan/youtube-shorts-pipeline/PLAN_GTA_NICHE.md).
  #
  # This is the lane that carries volume AND the lane that survives YPP
  # review. Original TTS narration over sourced b-roll, assembled as a
  # countdown, is genuinely transformed output. The shorts-pipeline clipper
  # (Lane B) is not, and a Lane-B-only catalogue should never be submitted for
  # monetisation.
  #
  # Query set deliberately asks for BREAKDOWN and ANALYSIS footage, never raw
  # trailer footage. Rockstar trailers are wall-to-wall score and would be
  # rejected by the global max_music_confidence: 0.55 -- and that value cannot
  # be overridden per-topic (see the note on `defaults:` above). Breakdown
  # footage has a person talking over it and clears the gate fine.
  #
  # Watch on the first run: max_text_coverage 0.18 + blur_detected_text will
  # bin a lot of GTA news footage (on-screen text, channel watermarks). If the
  # vet stage starves the render, raise candidates_per_topic -- but note that
  # is global too, so the extra sourcing cost lands on fishing and animals.
  # -------------------------------------------------------------------------
  gta6_countdown:
    title: "TOP {n} GTA 6 DETAILS"
    queries:
      - "gta 6 trailer breakdown details"
      - "gta 6 extended look analysis"
      - "gta 6 map leonida breakdown"
      - "gta 6 details you missed"
      - "gta 6 confirmed features"
      - "gta 6 vs gta 5 comparison"
    channels: []
    extra_sources: []
    # "leaked footage" / "leaked gameplay" / "leaked build" are the hard line.
    # Rockstar tolerates coverage -- it is free marketing -- but aggressively
    # nukes leaked-build videos. Discussing leaks is fine; hosting the footage
    # is channel-ending.
    negative_keywords: ["leaked footage", "leaked gameplay", "leaked build", "fan made", "concept", "mod showcase", "reaction", "livestream", "podcast", "ai generated"]
    channel: gta6_countdown
    tags: ["gta6", "gta6trailer", "leonida", "gtavi", "shorts"]
