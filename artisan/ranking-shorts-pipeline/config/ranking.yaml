# Ranking Shorts pipeline configuration.
# Runtime files are outside the repo; set VIDEO_FACTORY_ROOT in config/.env
# to the same shared parent used by the other video pipelines.

defaults:
  clips_per_video: 5
  min_clip_seconds: 2.5
  max_clip_seconds: 40
  target_total_seconds: 170
  hard_max_total_seconds: 180
  candidates_per_topic: 60
  max_download_attempts: 6
  max_download_height: 480
  max_download_bytes: 100000000
  # Shorts are small by duration, so keep the source quality high. The
  # downloader's max_filesize remains the hard 50MB ceiling for these topics.
  shorts_download_height: 1080
  shorts_max_download_bytes: 50000000
  max_source_duration: 900
  min_source_views: 500
  max_words_per_second: 0.45
  max_music_confidence: 0.75
  max_text_coverage: 0.18
  blur_detected_text: true
  # Optional path to a yt-dlp cookies.txt/Netscape export. When set, downloads
  # use it (fixes "Sign in to confirm you're not a bot"). Empty = default.
  yt_cookies: ""
  min_motion_score: 0.02
  phash_distance: 6
  rank_colors:
    1: "0xFFD700"
    2: "0xFFFFFF"
    3: "0xFF7F00"
    4: "0x00E676"
    5: "0xFF3B6B"
  rank_fill: "white"
  rank_outline: "black"
  accent_color: "0x1E90FF"
  # Listicle overlay styling (Pillow-rendered). stroke_ratio is the black
  # outline as a fraction of font size; shadow_x/y are the hard drop shadow.
  highlight_color: "0xFFD700"
  highlight_keywords: ["MOMENTS"]
  stroke_ratio: 0.07
  shadow_x: 6
  shadow_y: 6
  emoji_font: "C:/Windows/Fonts/seguiemj.ttf"
  video_title_fontsize: 110
  video_title_body_fontsize: 64
  video_title_y: 200
  # Ranked side-list: a compact column of numbered rows in the corner so the
  # footage stays the focus. The playing clip's row is highlighted.
  list_x: 60
  list_y: 430
  list_row_h: 130
  list_rank_size: 84
  list_label_size: 46
  transition: zoomin
  transition_duration: 0.28
  hook_zoom: true
  hook_zoom_amount: 1.18
  hook_zoom_frames: 24
  vo_offset: 0.4
  vo_gain: 1.6
  duck_threshold: 0.05
  duck_ratio: 8
  sfx_gain: 0.9
  swoosh_gain: 0.5
  music_enabled: false
  music_volume: 0.12

sfx_map:
  swoosh: swoosh.mp3
  slip: cartoon_slip.mp3
  fall: cartoon_slip.mp3
  splash: splash.mp3
  water: splash.mp3
  hit: punch.mp3
  crash: crash.mp3
  scream: scream.mp3
  boing: boing.mp3
  record: record_scratch.mp3
  fail: sad_trombone.mp3

topics:
  fishing_moments:
    title: "TOP {n} FISHING MOMENTS"
    source_kind: youtube_shorts
    allow_commentary: true
    allow_music: true
    queries: ["fishing fail #shorts", "unexpected fishing catch #shorts", "funny fishing moment #shorts", "fishing underwater gopro", "pike strike underwater", "fish jumping out of water", "fishing action camera", "fishing fail gopro straight line", "unexpected catch slow motion fishing", "fisherman knocked off dock", "pike jumps into boat"]
    channels: []
    extra_sources: []
    max_download_attempts: 12
    min_source_duration: 3
    max_source_duration: 90
    min_source_views: 100
    negative_keywords: ["compilation", "reaction", "top 10", "top 5", "ranked", "tutorial", "asmr", "music", "podcast", "commentary", "full video"]
