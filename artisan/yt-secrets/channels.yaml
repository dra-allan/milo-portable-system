# Single source of truth for YouTube channel keys, owners, projects, token
# destinations, channel IDENTITY (2026-08-19) and CONTENT ROUTING (2026-08-23).
#
# WHY channel_id MATTERS
# ---------------------
# On 2026-08-16 the wealth_mindset token was minted while signed into the wrong
# Google account, resolved to the "Chop UG" channel, and published four clips
# there. Nothing errored: there was no recorded answer to "what channel is
# wealth_mindset supposed to be?", so nothing could disagree.
#
# Filling in channel_id below turns that into a refusal. Until it is filled in,
# the auth CLI binds the key to whatever channel it first resolves to and writes
# that into channel_identity.json (machine-written, do not hand-edit), then
# enforces it from then on. A value here always wins over the ledger.
#
# You do NOT paste channel_id by hand any more: a successful auth/sync writes it
# into this file itself (comments preserved, .bak kept).
#   Re-auth everything, one channel at a time:  reauth_all_channels.bat
#   Backfill ids from tokens you already have:  reauth_all_channels.bat --sync
#   Audit this file for mismatches:             reauth_all_channels.bat --doctor
#
# WHY content/niches/variant MATTER
# ---------------------------------
# Identity only proves WHICH channel a token controls. It cannot tell that a
# Luganda gossip clip is about to be published to a forex channel, or that a
# ranked countdown is being pushed through the shorts lane. Those routing facts
# used to live in a different file (youtube-shorts-pipeline/config/niches.yaml)
# with nothing tying the two together.
#
#   pipelines:  the ONLY lanes allowed to publish with this channel's token.
#               shorts | clipper | ranking | pov. A publish from any other lane
#               is refused (MILO_CHANNEL_CONTENT=enforce, the default).
#   niches:     allow-list of niches.yaml keys that may publish here. A niche
#               outside the list is refused.
#   variant:    ranking lane only. normal = ranked countdowns, contrast =
#               "OTHERS VS THIS GUY". Routing the wrong variant is refused.
#   content:    plain English, for humans and for the error message you will
#               read six months from now.
#
# token_dir must match the pipeline: shorts and clipper share
# artisan/youtube-shorts-pipeline/config, ranking uses
# artisan/ranking-shorts-pipeline/config, pov uses artisan/pov_pipeline/config.
# `--doctor` fails on a mismatch, because a token minted into the wrong config
# dir authenticates perfectly and then publishes nothing.
#
# New channel: run  reauth_all_channels.bat --add  which asks for the key, owner,
# project slug, lanes and Chrome profile, writes the block, authenticates it and
# records its channel_id. Then add content/niches by hand.
#
# chrome_profile: <Chrome profile directory>
#   Which Chrome profile is signed into `email`. The auth flow launches the
#   consent page in that profile instead of the default browser, so the account
#   picker starts on the right account. "Default", "Profile 1", "Profile 2"...
#
# client_from: <other key>
#   Use that channel's OAuth client instead of this one's. Only needed when a
#   channel's own Google Cloud client is gone (see flick_shorts).
channels:

  # ---------------------------------------------------------------------
  # SHORTS lane (+ clipper). Long-form podcast/talk sources cut into Shorts.
  # ---------------------------------------------------------------------
  flick_shorts:
    email: draallan0@gmail.com
    slug: draallan0
    active: true
    pipelines: [shorts, clipper]
    token_dir: artisan/youtube-shorts-pipeline/config
    # 2026-08-23 remapped to the REAL Chrome profile dirs on this machine
    # (read from Chrome's Local State). The old values named profiles that did
    # not exist, and Chrome silently created fresh unsigned ones -- a consent
    # page opening on no account at all.
    # draallan0@gmail.com = Profile 4, adrasaltsxxx@gmail.com = Default,
    # draallan12@gmail.com = Profile 5, daadaallan0@gmail.com = Profile 12,
    # draallan84@gmail.com = Profile 6, allandaada@gmail.com = Profile 7.
    chrome_profile: Profile 4
    content: Life lessons, hard truths and mindset clips from long-form podcasts
    niches: [flick_shorts]
    channel_id: 'UCFWY9jrOMuauvho3XpIzACw'
    # CLIENT RECREATED (2026-08-23): the original flick-shorts OAuth client
    # (…-aggfh…) was deleted in Google Cloud; a new Desktop client (…-e00rk…)
    # now lives in the same yt-flick-shorts project and sits in
    # draallan0/credentials.json. This channel authenticates against its OWN
    # project again, which restores its separate 10k/day quota.

  capital_mindset:
    email: draallan0@gmail.com
    slug: draallan0
    active: true
    pipelines: [shorts, clipper]
    token_dir: artisan/youtube-shorts-pipeline/config
    chrome_profile: Profile 4
    content: Business, sales and founder clips - how companies and money work
    niches: [capital_mindset]
    channel_id: 'UCycs2dZT3bA4zUVLFWYI3Iw'

  wealth_mindset:
    email: adrasaltsxxx@gmail.com
    slug: adrasaltsxxx
    active: true
    pipelines: [shorts, clipper]
    token_dir: artisan/youtube-shorts-pipeline/config
    chrome_profile: Default
    # Same subject matter as capital_mindset but its own niche with independent
    # per-source budgets, so the two never publish the same clip.
    content: Wealth building and money mindset clips
    niches: [wealth_mindset]
    # Re-authed correctly on 2026-08-18 after the Chop UG mix-up. The auth flow
    # now writes the id here automatically, so the mix-up cannot recur silently.
    channel_id: 'UCHBboDmff-Ns2z0vDp2aYEg'

  NXS:
    email: draallan12@gmail.com
    slug: adrasaltsxxx
    active: true
    pipelines: [shorts, clipper]
    token_dir: artisan/youtube-shorts-pipeline/config
    # Owned by draallan12 but rides project B (adrasaltsxxx). Consent must be
    # approved while signed in as draallan12 -- the single most common cause of
    # a wrong-channel bind on this account, which is why the profile is pinned.
    # draallan12@gmail.com = Profile 5 on this machine.
    chrome_profile: Profile 5
