# yt-secrets/channels.yaml
# ---------------------------------------------------------------------------
# One Google Cloud project per owning email. Every channel under an email uses
# that email's project (one OAuth client, per-channel tokens) so each project
# carries its own YouTube Data API daily quota (10k units/day) instead of all
# channels sharing the single shorts-pipeline project's quota. That shared
# project is what hit the 400/429 upload wall.
#
# key: the channel key used in pipeline config (upload_channels / niche /
#   campaign spec upload_channel). Token files are named youtube_token_<key>.json
#   next to that email's credentials.json in yt-secrets/<email-slug>/.
# email: the gmail that OWNS the channel and runs the Google Cloud project.
#
# The value in `token_dir` is where mint writes the finished token. Pipelines
# already resolve tokens there:
#   shorts  -> artisan/youtube-shorts-pipeline/config
#   pov     -> artisan/pov_pipeline/config
#   clipper -> POV_SECRETS_DIR (= shorts config dir on this machine)
#
# Keys/emails below cover every channel we have ever minted or planned to
# post from. A channel is only uploaded to when its token exists; delete a row
# here only when you are certain the channel is retired for good.

channels:
