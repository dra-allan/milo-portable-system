    slug: adrasaltsxxx
    token_dir: artisan/youtube-shorts-pipeline/config
  dra_allan_official:
    email: adrasaltsxxx@gmail.com
    slug: adrasaltsxxx
    token_dir: artisan/pov_pipeline/config
  NXS:
    email: draallan12@gmail.com
    slug: adrasaltsxxx
    token_dir: artisan/youtube-shorts-pipeline/config
  explaination:
