    channel_id: 'UC6JRCEnk0a3_LxHhfgfn7Xg'

  god_did_fx:
    email: draallan84@gmail.com
    slug: adrasaltsxxx
    active: true
    pipelines: [shorts, clipper]
    token_dir: artisan/youtube-shorts-pipeline/config
    # draallan84@gmail.com = Profile 6 on this machine.
    chrome_profile: Profile 6
    content: Forex trading education - strategy, psychology, risk management
    niches: [forex_god_fx]
    channel_id: 'UCkMwgXBh41U0C_lgIGZ2Uzw'

  moviegasm:
    email: allandaada@gmail.com
    slug: draallan0
    # INACTIVE on the shorts/clipper lanes (2026-08-23, Allan's call): no niche
    # in niches.yaml feeds it, so an active registration here only advertised a
    # lane that could never legitimately publish to it. Campaigns still target
    # moviegasm via the campaign clipper's own channel config, which is
    # unaffected by this flag.
    active: false
    pipelines: [shorts, clipper]
    token_dir: artisan/youtube-shorts-pipeline/config
    # allandaada@gmail.com = Profile 7 on this machine.
    chrome_profile: Profile 7
    # No declared shorts-lane content yet. When a niche is ever pointed here,
    # fill content:/niches: and flip active: back to true -- an active channel
    # with undeclared content is how a clip from whatever niche ran last ends
    # up here.
    content: ''
    niches: []
    channel_id: 'UCjSnx-VZDUhRxMFiYHqnk3Q'

  # ---------------------------------------------------------------------
  # RANKING lane. Separate pipeline, separate token dir, two variants.
  # ---------------------------------------------------------------------
  rankdrop:
    email: daadaallan0@gmail.com
    slug: draallan0
    active: true
    pipelines: [ranking]
