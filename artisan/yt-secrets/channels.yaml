# yt-secrets/channels.yaml
# ---------------------------------------------------------------------------
# TWO funded Google Cloud projects (each carries its own YouTube Data API
# daily quota, 10k units/day ~= ~6 uploads/day). Channels are split across
# them so no single project hits the 400/429 upload wall.
#
#   PROJECT A  yt-flick-shorts  (owner draallan0@gmail.com)
#   PROJECT B  milo-mcp         (owner adrasaltsxxx@gmail.com)
#
# Each channel row:
#   email      - the gmail that OWNS the channel (also: the account that must
#                approve consent and be on the project's test-user list).
#   slug       - yt-secrets/<slug>/credentials.json = the OAuth client used to
#                mint this channel's token (i.e. which project it counts
#                against). A channel rides its OWNER's project when one is
#                funded, else the owner must be added as a test user on the
#                project the slug points at.
#   token_dir  - where mint writes youtube_token_<key>.json:
#                shorts  -> artisan/youtube-shorts-pipeline/config
#                pov     -> artisan/pov_pipeline/config
#                clipper -> POV_SECRETS_DIR (= shorts config dir on this box)
#
# A channel is only uploaded to when its token exists. Delete a row only when
# the channel is retired for good.

channels:
  # ============================ PROJECT A (yt-flick-shorts) ================
  # Funded: yes. Test users on consent screen: draallan0@gmail.com.
  flick_shorts:
    email: draallan0@gmail.com
    slug: draallan0
    token_dir: artisan/youtube-shorts-pipeline/config
  capital_mindset:
    email: draallan0@gmail.com
    slug: draallan0
    token_dir: artisan/youtube-shorts-pipeline/config

