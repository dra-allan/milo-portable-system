# Campaign clipper: style and machine defaults only.
#
# Campaign RULES do not belong here. They live in config/campaigns/<id>.yaml,
# which is schema-validated on load. A requirement hidden in shared defaults
# would silently apply to every campaign, including the ones it is wrong for -
# which is exactly the bug this split exists to prevent.

defaults:
  # Aimed for, then clamped into each campaign's legal band. Never equal to a
  # campaign minimum: a clip rendered at exactly the minimum has no margin for
  # keyframe-aligned seeking or a platform re-encode rounding down.
  target_duration: 22
  clips_per_run: 3

style:
  text_size: 76
  # Word-by-word captions burned from the Whisper transcript (same engine and
  # presets as the Shorts lane). Env vars CAPTION_* win over these values;
  # these are the shared default look.
  caption_enabled: true
  caption_style: viral        # viral | hormozi | kinetic | single | minimalist | neon
  caption_font_size: 0        # 0 = engine preset default; e.g. 88 to force
  caption_max_words: 0        # 0 = engine preset default; cap words per caption
  caption_punch_ratio: 0.22

# Fallback hooks for when there is no model key or the model call fails.
# Deliberately generic: a hook that names a game or a streamer would be wrong
# on most campaigns, and wrong copy is worse than plain copy.
hook_templates:
  - WAIT FOR IT
  - THIS IS INSANE
  - HE ACTUALLY DID THAT
  - NO WAY THIS HAPPENED
  - WATCH TILL THE END
  - THIS CHANGED EVERYTHING
  - I CANT BELIEVE THIS
  - THE ENDING THOUGH

# Global forbidden terms, checked in addition to each campaign's own banned
# topics. Word-boundary matched, so these do not fire inside longer words.
banned_words:
  - nsfw
  - onlyfans
  - slur
  - suicide
  - overdose

# ---------------------------------------------------------------------------
# Autopilot intake rules.
#
# Data, not code: this is the eligibility wall that made every prior submission
# worthless, so it has to be adjustable without a code change. All 47
# submissions under Roobet [CLIPPING] 3 came back Ineligible because it demands
# 1000 followers per social profile and the campaign channels have 0-22. The day
# a channel clears 1000, delete the follower keywords here and gated campaigns
# (which are the better-paying ones, precisely because the wall thins the
# competition) become available with no code change.
#
# Keywords are substring-matched, case-insensitively, against every requirement
# row on the campaign page: obligations, prohibitions AND rows whose marker
# colour could not be classified.
# ---------------------------------------------------------------------------
intake:
  max_progress_pct: 20          # only campaigns using less than this much budget
  reject_keywords:
    - min followers
    - min followers per social profile
    - min subscribers
    - minimum followers
    - minimum subscribers
    - min views
    - minimum views
    - min engagement
    - minimum engagement
    - engagement percentage
  # The only channels campaign clips may ever be posted to. chop_ug, rankdrop,
  # the_other_guys and explaination are reserved for the shorts/ranking lane and
  # are deliberately absent: a campaign resolving to one of them is skipped.
  campaign_channels:
    - capital_mindset
    - wealth_mindset
    - flick_shorts
    - moviegasm
    - NXS
  # Where a campaign whose niche is unrecognised goes. flick_shorts is the
  # "post anything, keep what goes viral" channel.
  unknown_niche_channel: flick_shorts

# opencli browser bridge (submission surface).
#
# profile is intentionally EMPTY. It identifies one physical Chrome on one
# machine, so a committed value would be wrong everywhere except the box it was
# written on, and opencli would submit through whichever bridge answered first.
# Set OPENCLI_PROFILE in the environment, or fill it in per machine.
opencli:
  bin: opencli
  session: clipster
  profile: ''
