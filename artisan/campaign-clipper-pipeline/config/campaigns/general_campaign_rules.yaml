  prohibitions:
  - 'Quality: Low-effort or spammy content will be rejected. Every submission should aim to be high-quality
    and have the potential to go viral.'
  - 'Spam caption: Captions and hashtags must be strictly related to your post and niche.'
  - 'Basic guidelines: Nothing sexually seductive. No IRL Funny Videos/Reality Shows/Cricket. No Manga
    (Black/White). No very brutal scenes. No H-comic (hentai). No SEA/RU/IN language posts (T3 countries).
    No SEA mobile games / Mobile Legends etc. No comic spam.'
