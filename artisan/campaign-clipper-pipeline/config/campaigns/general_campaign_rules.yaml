raw_requirements: 'Using viewbots or fake views

  Running advertisements to boost your posts

  Sharing your content in engagement groups

  Retweeting or quote-tweeting your own post on X (Twitter)

  Shoutouts or reposts from unrelated third-party accounts

  Posts MUST stay up for a minimum of 30 Days after campaign end! Taking down posts before this time frame
  may result in ban.

  Quality: Low-effort or spammy content will be rejected. Every submission should aim to be high-quality
  and have the potential to go viral.

  Originality: Do not submit duplicate content. Each post must be unique and created specifically for
  the campaign.

  Niches: Content aimed at a predominantly south asian audience will be rejected. This includes but is
  not limited to Cricket, mobile games and apps, bollywood content etc. Also any content related to NSFW
  may lead to a suspension.

  Visibility: All post stats (likes, comments, etc.) must be publicly visible. Hidden stats will disqualify
  your submission.

  Engagement: Campaigns have unique engagement tresholds. 0.2% platform wide and up to 3% for higher CPM
  campaigns.

  Spam caption: Captions and hashtags must be strictly related to your post and niche.

  Basic guidelines: Nothing sexually seductive. No IRL Funny Videos/Reality Shows/Cricket. No Manga (Black/White).
  No very brutal scenes. No H-comic (hentai). No SEA/RU/IN language posts (T3 countries). No SEA mobile
  games / Mobile Legends etc. No comic spam.

  Audio must be the main focus and played at 75% minimum, must play throughout the whole video, can have
  a little intro

  No combination of a second campaign (logo etc.)

  3% engagement requirement

  Video posts must be over 10 seconds long

  Use the provided template file ("LOGO_PRE_PLACED", 1080×1920) — the logo comes pre-placed in the approved
  position. Do not move, resize, or reposition it.

  Logos are provided as GIFs with transparent backgrounds. Do not alter the GIF file — no stretching,
  distorting, recoloring, filters, or effects that reduce legibility.

  The logo must be clearly visible at all times and must not be covered more than 50% by platform UI (captions,
  usernames, buttons) or other graphics.

  Animated GIF logos must play from start to finish without interruption and must loop. The logo must
  stay fully visible for the entire required duration (typically 7–25+ seconds, varies by asset).

  Placing the logo with more than 25% overlap on the safezone''s red "no-go" zone will most likely get
  rejected.

