# ===========================================================================
# gta_hype -- APPEND-ONLY SNIPPET, NOT LOADED ON ITS OWN
#
# config.py reads config/niches.yaml by exact path, so this file does nothing
# until its contents are appended to that file. YAML top-level mappings merge
# by append, so appending is equivalent to editing:
#
#   Windows:  type config\niches.gta_hype.snippet.yaml >> config\niches.yaml
#   bash:     cat config/niches.gta_hype.snippet.yaml >> config/niches.yaml
#
# Then verify the merge parsed before running anything:
#
#   python -c "from src.config import config; print(config.niches_error); print('gta_hype' in config.niche_names())"
#
# Expect: None / True. Anything else means the append landed mid-block --
# revert niches.yaml from git and retry.
#
# Shipped as a snippet on purpose: niches.yaml is ~1400 lines of live config
# for 25 running niches, and a full-file rewrite risks silently dropping a
# keyword from one of them. Appending cannot.
#
# Full rationale for every value below: PLAN_GTA_NICHE.md
# ===========================================================================

gta_hype:
  # Requires: python -m src.uploader auth --channel gta_hype
  upload_channels:
    - gta_hype
  channel: gta_hype
  max_videos: 4
  # Group 1 -- GTA-dedicated. Safe with or without the require_keywords gate.
  # VERIFY EVERY HANDLE with add_channel.bat before the first sweep. A handle
  # that fails listing enters the dead-channel cache for 14 days (see
  # DEAD_CHANNEL_COOLDOWN_DAYS), which is longer than the runway to Aug 27.
  channels:
    - "@MrBossFTW"        # daily GTA 6 news, desk cam, 4-10 min, real captions
    - "@LegacyKillaHD"    # GTA 6 news + analysis, 10-20 min
    - "@GTASeriesVideos"
    - "@DarkViperAU"      # news + reaction VODs, best talk density on this list
    - "@SernandoE"
  # Group 2 -- broad gaming channels. These ONLY belong here because
  # require_keywords gates them. Remove them if that key is removed.
    - "@gameranxTV"       # NOT "@gameranx" -- verify before enabling
    - "@DigitalFoundry"
    - "@IGN"
    - "@GameSpot"
    - "@Nought"
    - "@TheGamer"
  # @RockstarGames is deliberately omitted: trailers run 60-180s and would be
  # rejected by min_duration on every sweep. Add it only if min_duration drops.
  #
  # THE TOPIC GATE (discovery.py). Titles must match at least one entry here
  # or they are dropped into skipped_off_topic. `keywords` below does NOT
  # filter and never has -- it is read only by processor.py, to score highlight
  # windows inside a video that discovery already accepted. Deleting this key
  # while Group 2 channels are listed will publish Nintendo clips to a GTA
  # channel, and the one-source-per-24h cap means that burns the whole day.
  require_keywords:
    - "gta"
    - "grand theft auto"
    - "rockstar"
    - "leonida"
    - "vice city"
  # Kept short on purpose. Keyword score caps at ~6 hits, so junk entries
  # saturate the cap and crowd out real signal. Do not "improve" this by
  # adding more (see PLAN_MINECRAFT_NICHE.md for what 300 keywords looks like).
  keywords:
    - "gta 6"
    - "gta vi"
    - "grand theft auto 6"
    - "grand theft auto vi"
    - "leonida"
    - "vice city"
    - "jason and lucia"
    - "trailer breakdown"
    - "extended look"
    - "frame by frame"
    - "details you missed"
    - "confirmed feature"
    - "release date"
    - "pre order"
    - "map size"
    - "open world"
    - "rockstar confirmed"
    - "everything we know"
    - "what nobody noticed"
    - "hidden detail"
  # NOTE: "trailer" and "teaser" are deliberately ABSENT. Every other niche in
  # niches.yaml blocks them. discovery.py word-boundary matches on the TITLE,
  # so inheriting that habit would reject "GTA 6 Trailer 3 Breakdown" -- the
  # single best source video type this niche has. Same reason "news",
  # "breaking news" and "gameplay" are absent: after Aug 27, "GTA 6 Gameplay
  # Analysis" is the highest-value title pattern that exists.
  # Negatives are for FORMATS, never for topics.
  #
  # "reaction" and "livestream" are also absent, against house style.
  # DarkViperAU's GTA news reaction VODs run 90k-280k views with excellent
  # talk density; blocking those two words removes the best source on the
  # list. max_duration does the bounding instead.
  negative_keywords:
    - "#shorts"
    - "shorts"
    - "clip"
    - "clips"
    - "compilation"
    - "music video"
    - "official audio"
    - "lyrics"
    - "fan made"
    - "fan edit"
    - "concept trailer"
    - "leaked footage"
    - "leaked gameplay"
    - "leaked build"
    - "mod showcase"
    - "gta 5 gameplay"
    - "roleplay"
    - "rp server"
    - "no commentary"
    - "full playthrough"
    - "giveaway"
    - "modded account"
  language: en
  # 180, not the house 240-600. Sampled Aug 2026: MrBossFTW's fast-turnaround
  # news videos run 3:53 (233s), and he is source #1. A 240 floor rejects the
  # densest single-topic supply on the list.
  min_duration: 180
  # 4h ceiling admits reaction VODs (dense talk tracks) while excluding
  # marathon streams whose transcription cost exceeds their clip yield.
  max_duration: 14400
  min_score: 0.48
  # Documentation only -- discovery.py never reads this key. Recency is
  # enforced structurally instead: /videos is newest-first and playlistend
  # truncates to DISCOVERY_LOOKBACK, so keep that at 3-5 for this niche.
  preferred_upload_days: 45
  # 8000, not the house 50000+. min_views is a RECENCY TAX: a high gate means
  # source videos are only ever seen after they have aged one to three days,
  # which is exactly backwards for a niche whose entire edge is being early.
  # Sampled Aug 2026: MrBossFTW's daily GTA 6 videos land at 13k-42k.
  min_views: 8000
