# niches.yaml
# Optimized for discovering long-form videos that can be cut into viral shorts.
# Channel entries may be YouTube channel IDs or quoted @handles.
# If your pipeline only supports channel IDs, resolve @handles before running.

flick_shorts:
  # Upload target(s): the channel(s) this niche's Shorts get published to.
  # Each key must match an authenticated token (config/youtube_token_<name>.json).
  upload_channels:
    - flick_shorts
  # Legacy single-channel binding (backward compatible). Redundant when
  # upload_channels is set.
  channel: flick_shorts
